name: Dokumentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: VitePress bauen
        run: npm run docs:build

      - name: Menüziele in DE/EN/FR prüfen
        run: python scripts/check-navigation.py

      - name: Vollständiges Sprachinventar prüfen
        run: python scripts/audit-doc-locales.py

      - name: UIX-Codebeispiele und Sprachverweise prüfen
        run: python scripts/check-uix-docs.py

      - name: UIX-Übersetzungsstand prüfen
        run: python scripts/check-uix-translations.py

      - name: GitHub-Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

      - name: Identischen Build für zweite Domain sichern
        uses: actions/upload-artifact@v4
        with:
          name: mirror-site
          path: docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4

  mirror:
    name: ugso-opensource.net synchronisieren
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mirror-site
          path: mirror-site
      - name: Geprüften Build auf zweite Domain veröffentlichen
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.NET_MIRROR_DEPLOY_KEY }}
        run: bash scripts/publish-net-mirror.sh mirror-site
