name: Check Home Assistant cards upstream

on:
  schedule:
    - cron: "20 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-home-assistant-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UGSo docs
        uses: actions/checkout@v4

      - name: Check original Home Assistant dashboard cards docs
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: https://github.com/home-assistant/home-assistant.io.git
          TRACKED_COMMIT_FILE: docs/sammlung/home-assistant-standardkarten/.upstream-commit
        run: |
          set -euo pipefail

          tracked_commit="$(cat "$TRACKED_COMMIT_FILE" | tr -d '[:space:]')"
          workdir="$(mktemp -d)"

          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" "$workdir/home-assistant.io"
          git -C "$workdir/home-assistant.io" fetch origin current
          git -C "$workdir/home-assistant.io" fetch origin "$tracked_commit" || true

          latest_commit="$(git -C "$workdir/home-assistant.io" rev-parse origin/current)"

          if [ "$tracked_commit" = "$latest_commit" ]; then
            echo "Home Assistant cards docs are already tracked at the latest upstream commit."
            exit 0
          fi

          changed_docs="$(git -C "$workdir/home-assistant.io" diff --name-only "$tracked_commit" "$latest_commit" -- \
            source/dashboards/cards.markdown \
            source/dashboards/actions.markdown \
            source/dashboards/features.markdown \
            source/dashboards/header-footer.markdown \
            source/dashboards/views.markdown \
            ':(glob)source/_dashboards/*.markdown' || true)"

          if [ -z "$changed_docs" ]; then
            echo "Home Assistant repository changed, but no tracked dashboard card docs changed."
            exit 0
          fi

          title="Home-Assistant-Standardkarten pruefen: Originaldoku wurde geaendert"
          existing_count="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"

          if [ "$existing_count" != "0" ]; then
            echo "An open Home Assistant cards documentation update issue already exists."
            exit 0
          fi

          short_tracked="${tracked_commit:0:7}"
          short_latest="${latest_commit:0:7}"
          compare_url="https://github.com/home-assistant/home-assistant.io/compare/${tracked_commit}...${latest_commit}"

          {
            echo "Die englische Originaldokumentation der Home-Assistant-Dashboard-Karten hat sich seit dem gespeicherten Stand geaendert."
            echo
            echo "- Gespeicherter Stand: \`$tracked_commit\`"
            echo "- Neuer Stand: \`$latest_commit\`"
            echo "- Vergleich: $compare_url"
            echo
            echo "Geaenderte ueberwachte Dateien:"
            echo
            echo "\`\`\`text"
            echo "$changed_docs"
            echo "\`\`\`"
            echo
            echo "Aufgabe:"
            echo "1. Aenderungen im Original pruefen."
            echo "2. Deutsche Doku unter \`docs/sammlung/home-assistant-standardkarten/\` aktualisieren."
            echo "3. \`docs/sammlung/home-assistant-standardkarten/.upstream-commit\` auf den neuen Commit setzen."
            echo "4. Lizenz- und Quellenstand aktualisieren."
          } > "$workdir/issue-body.md"

          gh issue create \
            --title "$title ($short_tracked -> $short_latest)" \
            --body-file "$workdir/issue-body.md"
