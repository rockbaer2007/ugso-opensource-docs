name: Check Frosted Glass Theme upstream

on:
  schedule:
    - cron: "20 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-frosted-glass-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UGSo docs
        uses: actions/checkout@v4

      - name: Check original Frosted Glass Theme docs
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: https://github.com/wessamlauf/homeassistant-frosted-glass-themes.git
          TRACKED_COMMIT_FILE: docs/sammlung/frosted-glass-theme/.upstream-commit
        run: |
          set -euo pipefail

          tracked_commit="$(cat "$TRACKED_COMMIT_FILE" | tr -d '[:space:]')"
          workdir="$(mktemp -d)"

          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" "$workdir/frosted-glass-theme"
          git -C "$workdir/frosted-glass-theme" fetch origin main
          git -C "$workdir/frosted-glass-theme" fetch origin "$tracked_commit" || true

          latest_commit="$(git -C "$workdir/frosted-glass-theme" rev-parse origin/main)"

          if [ "$tracked_commit" = "$latest_commit" ]; then
            echo "Frosted Glass Theme is already tracked at the latest upstream commit."
            exit 0
          fi

          changed_docs="$(git -C "$workdir/frosted-glass-theme" diff --name-only "$tracked_commit" "$latest_commit" -- \
            README.md \
            hacs.json \
            LICENSE \
            ':(glob)themes/*.yaml' || true)"

          if [ -z "$changed_docs" ]; then
            echo "Frosted Glass Theme repository changed, but no tracked files changed."
            exit 0
          fi

          title="Frosted-Glass-Theme pruefen: Original wurde geaendert"
          existing_count="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"

          if [ "$existing_count" != "0" ]; then
            echo "An open Frosted Glass Theme update issue already exists."
            exit 0
          fi

          short_tracked="${tracked_commit:0:7}"
          short_latest="${latest_commit:0:7}"
          compare_url="https://github.com/wessamlauf/homeassistant-frosted-glass-themes/compare/${tracked_commit}...${latest_commit}"

          {
            echo "Das Frosted-Glass-Theme-Repository hat sich seit dem gespeicherten Stand geaendert."
            echo
            echo "- Gespeicherter Stand: \`$tracked_commit\`"
            echo "- Neuer Stand: \`$latest_commit\`"
            echo "- Vergleich: $compare_url"
            echo
            echo "Geaenderte ueberwachte Dateien:"
            echo
            echo "\`\`\`text"
            echo "$changed_docs"
            echo "\`\`\`"
            echo
            echo "Aufgabe:"
            echo "1. Aenderungen im Original pruefen."
            echo "2. Deutsche Notiz unter \`docs/sammlung/frosted-glass-theme/\` aktualisieren."
            echo "3. \`docs/sammlung/frosted-glass-theme/.upstream-commit\` auf den neuen Commit setzen."
          } > "$workdir/issue-body.md"

          gh issue create \
            --title "$title ($short_tracked -> $short_latest)" \
            --body-file "$workdir/issue-body.md"
